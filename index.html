<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crea y juega cuestionarios interactivos para tus estudiantes: proyecta las preguntas y deja que se unan desde el móvil con un PIN. Funciona directamente en el navegador." />
  <title>QuizAula · Cuestionarios interactivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232d5bd6'/><text x='50' y='74' font-size='66' font-family='Segoe UI, Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'>Q</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Las vistas se renderizan aquí mediante JavaScript -->
    <div class="loading">Cargando…</div>
  </div>

  <!-- Contenedor de notificaciones -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!--
    Cliente de Socket.IO empaquetado localmente (ruta relativa) para que funcione
    también en GitHub Pages. Así el modo EN VIVO puede conectarse a un servidor
    remoto (Railway/Render) aunque la web esté alojada de forma estática.
  -->
  <script src="js/vendor/socket.io.min.js"></script>

  <!-- Scripts (sin módulos ES para que funcione también al abrir el archivo localmente) -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/live-common.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/game.js"></script>
  <script src="js/host.js"></script>
  <script src="js/player.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
